name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/Bala/ECommerce/RestoreCourse
          git pull origin main

      - name: Run deploy script
        run: |
          cd /home/Bala/ECommerce/RestoreCourse
          chmod +x deploy.sh
          ./deploy.sh
